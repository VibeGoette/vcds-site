name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

jobs:
  checks:
    name: Type-check, test, audit & build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm run test

      # Audit reports high/critical vulnerabilities but does not block the build
      # (non-zero exit allowed via continue-on-error). Flip to false once the
      # project dependency tree is fully clean.
      - name: Security audit
        run: npm audit --audit-level=high --production
        continue-on-error: true

      # Note: next/font/google fetches Quicksand at build time.
      # GitHub Actions runners have outbound HTTP access to fonts.googleapis.com,
      # so no workaround is needed. PAYLOAD_SECRET is intentionally absent —
      # the SEC-01 hotfix (b2ce7b7) degrades to a warning, not a build error.
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
