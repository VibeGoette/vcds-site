services:
  vcds-site:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PAYLOAD_SECRET=${PAYLOAD_SECRET}
      - DATABASE_URI=file:/app/data/database.db
      - SITE_URL=${SITE_URL:-https://vcds.de}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-https://vcds.de}
      # E-Mail (optional)
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - RESEND_DOMAIN=${RESEND_DOMAIN:-vcds.de}
      - CONTACT_EMAIL_TO=${CONTACT_EMAIL_TO:-support@vcds.de}
      # Bot-Schutz (optional)
      - NEXT_PUBLIC_TURNSTILE_SITE_KEY=${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY:-}
      # Draft Preview (optional)
      - DRAFT_SECRET=${DRAFT_SECRET:-}
      # Analytics (optional)
      - NEXT_PUBLIC_UMAMI_WEBSITE_ID=${NEXT_PUBLIC_UMAMI_WEBSITE_ID:-}
      - NEXT_PUBLIC_UMAMI_URL=${NEXT_PUBLIC_UMAMI_URL:-}
    volumes:
      - vcds-data:/app/data
      - vcds-media:/app/media
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  vcds-data:
    driver: local
  vcds-media:
    driver: local
